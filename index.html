<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#082b70">
  <title>Pemindai QR Warga RT.004 RW.02</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(145deg,#061b49,#0b4da3 60%,#087fae);font-family:Arial,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:18px}
    .wrap{width:min(100%,520px);background:#fff;color:#16315b;border-radius:22px;padding:22px;box-shadow:0 18px 55px #00183c88}
    .brand{text-align:center;margin-bottom:16px}
    .brand h1{font-size:21px;margin:8px 0 4px;color:#082b70}
    .brand p{margin:0;color:#64748b;font-size:13px}
    .mark{width:58px;height:58px;border-radius:15px;background:#eaf3ff;display:inline-flex;align-items:center;justify-content:center;color:#0b63ce;font-size:28px}
    #reader{width:100%;min-height:260px;border:2px dashed #9bb8df;border-radius:16px;overflow:hidden;background:#f8fbff}
    .actions{display:flex;gap:10px;margin-top:14px}
    button{flex:1;border:0;border-radius:12px;padding:13px 10px;font-weight:700;font-size:14px;cursor:pointer}
    #start{background:#075bd8;color:#fff}#stop{background:#e8eef8;color:#17345f}
    #status{padding:12px;border-radius:10px;background:#f1f6ff;color:#405778;font-size:13px;margin-top:13px;line-height:1.5}
    .foot{text-align:center;color:#718096;font-size:11px;margin-top:14px}
    a{color:#075bd8}
  </style>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <div class="mark">▦</div>
      <h1>Pemindai QR Identitas</h1>
      <p>Data Warga RT.004 RW.02</p>
    </header>
    <div id="reader"></div>
    <div class="actions">
      <button id="start" type="button">Buka Kamera</button>
      <button id="stop" type="button" disabled>Hentikan</button>
    </div>
    <div id="status" role="status">Tekan “Buka Kamera”, izinkan akses kamera, lalu arahkan ke QR pada kartu warga/pengurus.</div>
    <div class="foot">Token QR hanya diteruskan ke aplikasi untuk divalidasi. Halaman ini tidak menyimpan data warga.</div>
  </main>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search);
  var appUrl=params.get('app')||'';
  var status=document.getElementById('status');
  var startBtn=document.getElementById('start');
  var stopBtn=document.getElementById('stop');
  var scanner=null, running=false, locked=false;

  function validToken(v){return /^[a-f0-9]{64}$/i.test(String(v||''));}
  function extractToken(value){
    value=String(value||'').trim();
    if(validToken(value))return value;
    try{
      var u=new URL(value);
      return u.searchParams.get('token')||u.searchParams.get('qr')||'';
    }catch(e){return '';}
  }
  function destination(token, sourceUrl){
    if(!validToken(token)){status.textContent='QR tidak dikenali. Pastikan kartu berasal dari RT.004 RW.02.';return;}
    var targetApp=appUrl;
    try{if(!targetApp && sourceUrl)targetApp=new URL(sourceUrl).searchParams.get('app')||'';}catch(e){}
    if(!targetApp){status.textContent='Alamat aplikasi belum tersedia. Buka pemindai dari tombol Scan QR aplikasi atau gunakan QR kartu yang baru.';return;}
    try{
      var dest=new URL(targetApp);
      dest.searchParams.set('qr',token);
      status.textContent='QR terbaca. Menghubungkan ke aplikasi untuk validasi...';
      location.replace(dest.toString());
    }catch(e){status.textContent='Alamat aplikasi tidak valid.';}
  }

  // Bila kamera HP langsung membuka QR kartu, token diteruskan otomatis ke GAS.
  var directToken=params.get('token')||params.get('qr')||'';
  if(validToken(directToken)){destination(directToken,location.href);return;}

  function setRunning(value){
    running=value;startBtn.disabled=value;stopBtn.disabled=!value;
  }
  async function startCamera(){
    if(running||locked)return;
    if(!window.Html5Qrcode){status.textContent='Pustaka kamera belum termuat. Periksa koneksi internet lalu muat ulang.';return;}
    locked=false;
    scanner=new Html5Qrcode('reader');
    status.textContent='Meminta izin kamera...';
    try{
      var cameras=await Html5Qrcode.getCameras();
      if(!cameras||!cameras.length)throw new Error('Kamera tidak ditemukan pada perangkat ini.');
      var camera=cameras.find(function(c){return /back|rear|environment|belakang/i.test(c.label);})||cameras[cameras.length-1];
      await scanner.start(camera.id,{fps:12,qrbox:{width:240,height:240},aspectRatio:1.0},
        function(decoded){
          if(locked)return;locked=true;
          var token=extractToken(decoded);
          if(!token){locked=false;status.textContent='Kode terbaca, tetapi bukan QR identitas RT.004 RW.02.';return;}
          status.textContent='QR terbaca. Menghentikan kamera dan memvalidasi...';
          scanner.stop().catch(function(){}).finally(function(){setRunning(false);destination(token,decoded);});
        },
        function(){}
      );
      setRunning(true);
      status.textContent='Kamera aktif. Arahkan kotak pemindai ke QR kartu.';
    }catch(err){
      setRunning(false);
      status.textContent='Kamera tidak dapat dibuka: '+(err&&err.message?err.message:String(err))+' Pastikan halaman dibuka melalui HTTPS dan izin kamera diaktifkan.';
    }
  }
  async function stopCamera(){
    if(scanner&&running){try{await scanner.stop();}catch(e){}}
    setRunning(false);status.textContent='Pemindaian dihentikan.';
  }
  startBtn.addEventListener('click',startCamera);
  stopBtn.addEventListener('click',stopCamera);
})();
</script>
</body>
</html>
